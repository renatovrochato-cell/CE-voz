<script>
(function(){
  var SAL='W5MqE/rDox4HqJNt7Cu1+g==', IT=250000, IV='sTBHothDE/hBl/Pw', GUARDA='acesso_k1';
  var cx=document.getElementById('cx'), campo=document.getElementById('c'), bt=document.getElementById('b'), msg=document.getElementById('m');
  function bytes(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function texto(a){ var s=''; for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
  function diz(t,erro){ msg.textContent=t||''; msg.className=erro?'e':''; }
  function lembrada(){ try{ return localStorage.getItem(GUARDA)||''; }catch(e){ return ''; } }
  function lembrar(v){ try{ if(v) localStorage.setItem(GUARDA,v); else localStorage.removeItem(GUARDA); }catch(e){} }
  function chaveDoCodigo(cod){
    cod=String(cod||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    return crypto.subtle.importKey('raw',new TextEncoder().encode(cod),'PBKDF2',false,['deriveBits']).then(function(base){
      return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(SAL),iterations:IT},base,256); }).then(function(b){ return new Uint8Array(b); });
  }
  function abrir(chave){
    return crypto.subtle.importKey('raw',chave,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,bytes(document.getElementById('d').textContent)); }).then(function(claro){
      return new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); });
  }
  function mostrar(html){
    document.open(); document.write(html); document.close();
    /* «#sair» escrito no endereço com a página já aberta: o aparelho esquece a
       chave e volta à caixa do código. Só depois de escrever a página — o
       document.open() tira os ouvintes que a janela tinha. */
    window.addEventListener('hashchange',function(){ if(location.hash==='#sair'){ lembrar(''); location.reload(); } }); }
  function pedir(t,erro){ cx.hidden=false; bt.disabled=false; diz(t,erro); try{ campo.focus(); }catch(e){} }
  function entrar(cod){
    bt.disabled=true; diz('A abrir…');
    chaveDoCodigo(cod).then(function(ch){ return abrir(ch).then(function(html){ lembrar(texto(ch)); mostrar(html); }); })
      .catch(function(){ pedir('Código errado.',true); });
  }
  if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){
    cx.hidden=false; bt.disabled=true; diz('Este navegador não consegue abrir a página. Usa o Chrome actualizado, por https.',true); return; }
  bt.onclick=function(){ if(campo.value.replace(/[^A-Za-z0-9]/g,'').length) entrar(campo.value); };
  campo.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); bt.onclick(); } };
  var h=String(location.hash||'');
  if(/^#sair$/.test(h)){ lembrar(''); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} pedir('Este aparelho deixou de ter acesso.'); return; }
  var m=/^#c=([A-Za-z0-9-]+)$/.exec(h);
  if(m){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} entrar(m[1]); return; }
  var g=lembrada();
  if(!g){ pedir(''); return; }
  var ch; try{ ch=bytes(g); }catch(e){ lembrar(''); pedir(''); return; }
  abrir(ch).then(mostrar).catch(function(){ lembrar(''); pedir('O código deste aparelho já não serve. Mete o código novo.',true); });
})();
